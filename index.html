<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentaurix | Line Art Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0b0b0e;
      color: #ffffff;
      text-align: center;
    }

    header {
      background-color: #141419;
      padding: 20px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      border-bottom: 1px solid #282832;
    }

    nav a {
      color: #a0a0b0;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #9d4edd;
    }

    section {
      padding: 100px 20px 50px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #9d4edd;
    }

    p {
      color: #cccccc;
      margin-bottom: 30px;
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 1200px;
    }

    .card {
      background: #181820;
      border: 1px solid #2a2a36;
      border-radius: 12px;
      padding: 15px;
      width: 280px;
    }

    /* Solución a las imágenes para GitHub Pages */
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#galeria">Galería</a>
    </nav>
  </header>

  <section id="inicio">
    <h1>ZENTAURIX</h1>
    <p>Estudio de Ilustración y Line Art</p>
  </section>

  <section id="galeria">
    <h1>Galería</h1>
    <div class="galeria">

      <div class="card">
        <!-- 
          Ruta corregida:
          1. Sin la barra '/' al principio para que funcione en GitHub Pages.
          2. Si la imagen falla o no existe en GitHub, carga un reemplazo visual para no dejar la pantalla en blanco.
        -->
        <img src="img/imagen1.jpg" alt="Arte 1" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200/181820/9d4edd?text=Imagen+1';">
      </div>

      <div class="card">
        <img src="img/imagen2.jpg" alt="Arte 2" onerror="this.src='https://via.placeholder.com/300x200/181820/9d4edd?text=Imagen+2';">
      </div>

      <div class="card">
        <img src="img/imagen3.jpg" alt="Arte 3" onerror="this.src='https://via.placeholder.com/300x200/181820/9d4edd?text=Imagen+3';">
      </div>

    </div>
  </section>

</body>
</html>
