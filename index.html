<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentaurix</title>
  <style>
    /* RESET Y ESTILOS BÁSICOS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: rgba(15, 15, 18, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      z-index: 1000;
      border-bottom: 1px solid #2a2a35;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #7000ff;
      text-decoration: none;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
      margin-left: 1.5rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #7000ff;
    }

    section {
      min-height: 100vh;
      padding: 6rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero {
      /* SOLUCIÓN RUTA CSS: Rutas relativas simples para GitHub Pages */
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                  url('./assets/bg.jpg') center/cover no-repeat;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    p {
      max-width: 600px;
      margin-bottom: 2rem;
      color: #a0a0b0;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1000px;
      margin-top: 2rem;
    }

    .card {
      background-color: #1a1a24;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2a2a35;
    }

    /* SOLUCIÓN A IMÁGENES QUE NO SE VEN */
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="#inicio" class="logo">ZENTAURIX</a>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#galeria">Galería</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <!-- SECCIÓN INICIO -->
  <section id="inicio" class="hero">
    <h1>Bienvenido a Zentaurix</h1>
    <p>Arte digital y experiencias interactivas.</p>
  </section>

  <!-- SECCIÓN GALERÍA -->
  <section id="galeria">
    <h2>Galería de Obras</h2>
    <div class="galeria">

      <!-- 
        CLAVE PARA GITHUB PAGES:
        1. Usar ./ al inicio (ruta relativa).
        2. Mantener nombres en minúsculas sin espacios (ej: obra1.jpg).
        3. Usar SVG/DataURI o Placeholders para pruebas locales inmediatas.
      -->
      <div class="card">
        <img src="./assets/obra1.jpg" alt="Obra 1" onerror="this.src='https://via.placeholder.com/400x300/1a1a24/ffffff?text=Imagen+1'">
        <div class="card-content">
          <h3>Ilustración Digital</h3>
        </div>
      </div>

      <div class="card">
        <img src="./assets/obra2.jpg" alt="Obra 2" onerror="this.src='https://via.placeholder.com/400x300/1a1a24/ffffff?text=Imagen+2'">
        <div class="card-content">
          <h3>Diseño 3D</h3>
        </div>
      </div>

      <div class="card">
        <img src="./assets/obra3.jpg" alt="Obra 3" onerror="this.src='https://via.placeholder.com/400x300/1a1a24/ffffff?text=Imagen+3'">
        <div class="card-content">
          <h3>Concept Art</h3>
        </div>
      </div>

    </div>
  </section>

  <!-- SECCIÓN CONTACTO -->
  <section id="contacto">
    <h2>Contacto</h2>
    <p>¿Tienes alguna consulta o proyecto en mente? Escríbenos directamente.</p>
  </section>

</body>
</html>
